<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#072530">
  <title>Porto Lotado</title>
</head>
<body>
  <canvas id="sea" aria-hidden="true"></canvas>
  <div id="app">
    <header class="hud">
      <div class="lvl">
        <span class="port" id="port">Porto de Santos</span>
        <span class="num">Nível <b id="lvl">1</b></span>
      </div>
      <div class="hud-r">
        <div class="coins" aria-label="Moedas"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f4b42c"/><circle cx="10" cy="10" r="6" fill="none" stroke="#b8820f" stroke-width="2"/></svg><span id="coins">0</span></div>
        <button class="pill-btn" id="bSound" aria-label="Som"></button>
        <button class="pill-btn" id="bShop">Loja</button>
      </div>
    </header>
    <div class="tip" id="tip" hidden>Toque num navio para pegar os contêineres do topo. Depois toque no navio de destino.</div>
    <main id="board" aria-label="Navios no porto"></main>
    <nav class="bar">
      <button class="act" id="bUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Desfazer<i class="badge" id="undoBadge">3</i></button>
      <button class="act" id="bRestart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Reiniciar</button>
      <button class="act" id="bHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>Dica<i class="badge ad">AD</i></button>
      <button class="act" id="bShip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h18l-2.5 6h-13z"/><path d="M8 14V9h8v5"/><path d="M12 3v3M10.5 4.5h3"/></svg>+1 Navio<i class="badge ad">AD</i></button>
    </nav>
  </div>
  <div class="modal" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
